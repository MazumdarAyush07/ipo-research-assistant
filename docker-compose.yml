services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - REDIS_URL=redis:6379
    depends_on:
      - redis
    volumes:
      - ./backend:/app

  pdf-parser:
    build:
      context: ./pdf-parser
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./pdf-parser:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules

  redis:
    image: redis:7
    ports:
      - "6379:6379"
