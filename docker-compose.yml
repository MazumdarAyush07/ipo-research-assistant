services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis:6379
      - PDF_PARSER_URL=http://pdf-parser:8000
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - ./storage:/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/worker"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis:6379
      - PDF_PARSER_URL=http://pdf-parser:8000
    depends_on:
      - redis
      - backend
      - pdf-parser
    volumes:
      - ./backend:/app
      - ./storage:/storage

  pdf-parser:
    build:
      context: ./pdf-parser
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./pdf-parser:/app
      - ./storage:/storage
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  storage_data:
