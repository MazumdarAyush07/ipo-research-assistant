services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis:6379
      - PDF_PARSER_URL=http://pdf-parser:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
    volumes:
      - ../storage:/storage
      - ../prompts:/prompts

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    command: ["/worker"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis:6379
      - PDF_PARSER_URL=http://pdf-parser:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
      - backend
      - pdf-parser
    volumes:
      - ../storage:/storage
      - ../prompts:/prompts

  pdf-parser:
    build:
      context: ../pdf-parser
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ../storage:/storage
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
